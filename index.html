<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบทะเบียนคุมใบอนุญาต</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .bento-card { background: #ffffff; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .badge-ok { background-color: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .badge-warn { background-color: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .badge-exp { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
    .badge-pending { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
  </style>
</head>
<body class="text-slate-900 antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-md">
          <i class="fa-solid fa-id-card text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-none">ระบบทะเบียนคุมใบอนุญาต</h1>
          <p class="text-xs text-indigo-600 font-semibold mt-1">License Management System</p>
        </div>
      </div>
      <button onclick="openFormModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm">
        <i class="fa-solid fa-circle-plus"></i> เพิ่มใบอนุญาตใหม่
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- KPI CARDS -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bento-card p-4">
        <p class="text-xs font-bold text-slate-500">ใบอนุญาตทั้งหมด</p>
        <h3 id="kpi-total" class="text-2xl font-extrabold text-slate-900 mt-1">0</h3>
      </div>
      <div class="bento-card p-4">
        <p class="text-xs font-bold text-emerald-600">ยังไม่หมดอายุ</p>
        <h3 id="kpi-ok" class="text-2xl font-extrabold text-emerald-600 mt-1">0</h3>
      </div>
      <div class="bento-card p-4">
        <p class="text-xs font-bold text-amber-600">ใกล้หมดอายุ (ภายใน 90 วัน)</p>
        <h3 id="kpi-warn" class="text-2xl font-extrabold text-amber-600 mt-1">0</h3>
      </div>
      <div class="bento-card p-4">
        <p class="text-xs font-bold text-rose-600">หมดอายุแล้ว</p>
        <h3 id="kpi-exp" class="text-2xl font-extrabold text-rose-600 mt-1">0</h3>
      </div>
    </div>

    <!-- SEARCH & FILTER -->
    <div class="bento-card p-4 flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="search-input" oninput="renderTable()" placeholder="ค้นหาชื่อโครงการ / เลขที่ใบอนุญาต..." class="pl-9 pr-4 py-2 w-full border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <select id="filter-agency" onchange="renderTable()" class="border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 w-full md:w-auto">
          <option value="ALL">ทุกหน่วยงาน</option>
          <option value="กรมทรัพยากรน้ำบาดาล">กรมทรัพยากรน้ำบาดาล</option>
          <option value="กรมเจ้าท่า">กรมเจ้าท่า</option>
          <option value="กรมอุทยานแห่งชาติ สัตว์ป่า และพันธุ์พืช">กรมอุทยานแห่งชาติฯ</option>
        </select>
        <select id="filter-status" onchange="renderTable()" class="border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 w-full md:w-auto">
          <option value="ALL">ทุกสถานะ</option>
          <option value="ยังไม่หมดอายุ">🟢 ยังไม่หมดอายุ</option>
          <option value="ใกล้หมดอายุ">🟡 ใกล้หมดอายุ</option>
          <option value="หมดอายุแล้ว">🔴 หมดอายุแล้ว</option>
        </select>
      </div>
    </div>

    <!-- TABLE -->
    <div class="bento-card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 border-b border-slate-200 text-slate-700 font-extrabold uppercase">
            <tr>
              <th class="p-3.5">เลขที่ / หน่วยงาน</th>
              <th class="p-3.5">ชื่อโครงการ / สถานที่</th>
              <th class="p-3.5">ประเภทกิจกรรม</th>
              <th class="p-3.5">วันที่ออก -> หมดอายุ</th>
              <th class="p-3.5 text-center">สถานะ</th>
              <th class="p-3.5">การต่ออายุ / เงื่อนไข</th>
              <th class="p-3.5 text-center">เอกสาร</th>
              <th class="p-3.5 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 font-medium"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- FORM MODAL -->
  <div id="form-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white max-w-3xl w-full rounded-2xl shadow-xl overflow-hidden border border-slate-200 max-h-[90vh] flex flex-col">
      <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
        <h3 id="modal-title" class="font-bold text-sm">📝 บันทึกข้อมูลใบอนุญาต</h3>
        <button onclick="closeFormModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="license-form" onsubmit="handleFormSubmit(event)" class="p-6 overflow-y-auto space-y-4">
        <input type="hidden" id="field-id">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">ชื่อสิ่ง/โครงการที่ขออนุญาต *</label>
            <input type="text" id="field-project-name" required placeholder="เช่น โครงการเจาะบ่อน้ำบาดาล..." class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">อำเภอ</label>
            <input type="text" id="field-amphoe" placeholder="เช่น แม่จัน" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">ตำบล / หมู่ที่</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="field-tambon" placeholder="ตำบล" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
              <input type="text" id="field-moo" placeholder="หมู่ที่" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
            </div>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">ประเภทงาน / กิจกรรมที่ขออนุญาต</label>
            <input type="text" id="field-work-activity-type" placeholder="เช่น ขุดเจาะและใช้น้ำบาดาล" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">หน่วยงาน / ประเภทใบอนุญาต *</label>
            <select id="field-agency-category" required class="w-full border border-slate-300 rounded-xl p-2 text-xs font-bold">
              <option value="กรมทรัพยากรน้ำบาดาล">กรมทรัพยากรน้ำบาดาล</option>
              <option value="กรมเจ้าท่า">กรมเจ้าท่า</option>
              <option value="กรมอุทยานแห่งชาติ สัตว์ป่า และพันธุ์พืช">กรมอุทยานแห่งชาติ สัตว์ป่า และพันธุ์พืช</option>
              <option value="อื่นๆ">อื่นๆ</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">เลขที่ใบอนุญาต</label>
            <input type="text" id="field-license-number" placeholder="เช่น นบ. 12/2569" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">วันที่ยื่นขออนุญาต</label>
            <input type="date" id="field-request-date" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">วันที่ออกใบอนุญาต</label>
            <input type="date" id="field-issue-date" onchange="calculateExpiry()" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">อายุใบอนุญาต (ปี)</label>
            <input type="number" id="field-validity-years" min="1" max="50" onchange="calculateExpiry()" placeholder="เช่น 5" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">วันที่หมดอายุ (คำนวณอัตโนมัติ)</label>
            <input type="text" id="field-exp-date-preview" readonly placeholder="จะแสดงหลังกรอกวันออกและอายุปี" class="w-full border border-slate-200 bg-slate-100 rounded-xl p-2 text-xs font-bold text-indigo-600">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">จำเป็นต้องต่ออายุหรือไม่</label>
            <select id="field-is-renewal-needed" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
              <option value="จำเป็น">จำเป็น</option>
              <option value="ไม่จำเป็น">ไม่จำเป็น</option>
              <option value="ยกเว้น">ยกเว้น</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">เงื่อนไขแนบท้าย / การต่ออายุ</label>
            <input type="text" id="field-renewal-conditions" placeholder="เช่น ยื่นต่ออายุล่วงหน้าอย่างน้อย 30 วัน" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">แนบไฟล์สแกนใบอนุญาต (PDF/รูปภาพ)</label>
            <input type="file" id="field-file-input" accept=".pdf,image/*" class="w-full border border-slate-300 rounded-xl p-2 text-xs">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-200">
          <button type="button" onclick="closeFormModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">ยกเลิก</button>
          <button type="submit" id="btn-submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Web App URL จาก Google Apps Script
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwcioF6Y-FcQYdt6Tz2zosROkM5l-mPXA_HmDwkOz34MWDJqHrHziavLloYN2nuiyz8oQ/exec";

    let globalData = [];

    window.addEventListener('DOMContentLoaded', loadData);

    async function loadData() {
      Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const json = await res.json();
        Swal.close();
        if (json.status === 'success') {
          globalData = json.data || [];
          renderKPI();
          renderTable();
        } else {
          Swal.fire('เกิดข้อผิดพลาด', json.message, 'error');
        }
      } catch (err) {
        Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
      }
    }

    function renderKPI() {
      document.getElementById('kpi-total').innerText = globalData.length;
      document.getElementById('kpi-ok').innerText = globalData.filter(d => d.doc_status === 'ยังไม่หมดอายุ').length;
      document.getElementById('kpi-warn').innerText = globalData.filter(d => d.doc_status === 'ใกล้หมดอายุ').length;
      document.getElementById('kpi-exp').innerText = globalData.filter(d => d.doc_status === 'หมดอายุแล้ว').length;
    }

    function renderTable() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const agencyFilter = document.getElementById('filter-agency').value;
      const statusFilter = document.getElementById('filter-status').value;

      const filtered = globalData.filter(d => {
        const matchSearch = (d.project_name || '').toLowerCase().includes(search) || (d.license_number || '').toLowerCase().includes(search);
        const matchAgency = agencyFilter === 'ALL' || d.agency_category === agencyFilter;
        const matchStatus = statusFilter === 'ALL' || d.doc_status === statusFilter;
        return matchSearch && matchAgency && matchStatus;
      });

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 font-bold">ไม่พบข้อมูลตามเงื่อนไขที่ค้นหา</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        let badgeClass = 'badge-pending';
        if (item.doc_status === 'ยังไม่หมดอายุ') badgeClass = 'badge-ok';
        if (item.doc_status === 'ใกล้หมดอายุ') badgeClass = 'badge-warn';
        if (item.doc_status === 'หมดอายุแล้ว') badgeClass = 'badge-exp';

        let fileBtn = item.file_url ? `<a href="${item.file_url}" target="_blank" rel="noopener noreferrer" class="px-2 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-100"><i class="fa-solid fa-file-pdf"></i> ดูไฟล์</a>` : `<span class="text-slate-400">-</span>`;

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="p-3.5">
              <div class="font-bold text-slate-900">${escapeHtml(item.license_number || '-')}</div>
              <div class="text-[11px] text-indigo-600 font-semibold">${escapeHtml(item.agency_category)}</div>
            </td>
            <td class="p-3.5">
              <div class="font-bold text-slate-900">${escapeHtml(item.project_name)}</div>
              <div class="text-[11px] text-slate-500">${escapeHtml(item.amphoe || '')} ${escapeHtml(item.tambon || '')} ${escapeHtml(item.moo || '')}</div>
            </td>
            <td class="p-3.5">${escapeHtml(item.work_activity_type || '-')}</td>
            <td class="p-3.5">
              <div>ออก: ${item.issue_date || '-'}</div>
              <div class="text-slate-500 font-bold">หมดอายุ: ${item.exp_date || '-'}</div>
            </td>
            <td class="p-3.5 text-center">
              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold inline-block ${badgeClass}">${item.doc_status}</span>
            </td>
            <td class="p-3.5">
              <div class="font-bold text-slate-800">${escapeHtml(item.is_renewal_needed)}</div>
              <div class="text-[11px] text-slate-500">${escapeHtml(item.renewal_conditions || '-')}</div>
            </td>
            <td class="p-3.5 text-center">${fileBtn}</td>
            <td class="p-3.5 text-center">
              <button onclick="confirmDelete('${item.id}')" class="text-rose-600 hover:text-rose-800 p-1"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function calculateExpiry() {
      const issueStr = document.getElementById('field-issue-date').value;
      const years = Number(document.getElementById('field-validity-years').value) || 0;
      if (issueStr && years > 0) {
        const issue = new Date(issueStr);
        const exp = new Date(issue.getFullYear() + years, issue.getMonth(), issue.getDate());
        document.getElementById('field-exp-date-preview').value = exp.toISOString().split('T')[0];
      }
    }

    function openFormModal() {
      document.getElementById('license-form').reset();
      document.getElementById('field-id').value = '';
      document.getElementById('field-exp-date-preview').value = '';
      document.getElementById('form-modal').classList.remove('hidden');
    }

    function closeFormModal() {
      document.getElementById('form-modal').classList.add('hidden');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      const formData = {
        id: document.getElementById('field-id').value,
        project_name: document.getElementById('field-project-name').value,
        amphoe: document.getElementById('field-amphoe').value,
        tambon: document.getElementById('field-tambon').value,
        moo: document.getElementById('field-moo').value,
        work_activity_type: document.getElementById('field-work-activity-type').value,
        agency_category: document.getElementById('field-agency-category').value,
        license_number: document.getElementById('field-license-number').value,
        request_date: document.getElementById('field-request-date').value,
        issue_date: document.getElementById('field-issue-date').value,
        validity_years: document.getElementById('field-validity-years').value,
        is_renewal_needed: document.getElementById('field-is-renewal-needed').value,
        renewal_conditions: document.getElementById('field-renewal-conditions').value
      };

      const fileInput = document.getElementById('field-file-input');
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const base64 = await convertFileToBase64(file);
        const uploadRes = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'upload', fileData: { fileName: file.name, mimeType: file.type, data: base64 } })
        }).then(r => r.json());

        if (uploadRes.status === 'success') {
          formData.file_url = uploadRes.url;
        }
      }

      const saveRes = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'save', data: formData })
      }).then(r => r.json());

      btn.disabled = false;
      btn.innerText = 'บันทึกข้อมูล';

      if (saveRes.status === 'success') {
        Swal.fire('บันทึกสำเร็จ!', saveRes.message, 'success');
        closeFormModal();
        loadData();
      } else {
        Swal.fire('เกิดข้อผิดพลาด', saveRes.message, 'error');
      }
    }

    async function confirmDelete(id) {
      if (!confirm(`ยืนยันการลบรายการ [${id}]?`)) return;
      Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id: id })
      }).then(r => r.json());
      Swal.close();
      if (res.status === 'success') {
        Swal.fire('ลบสำเร็จ', res.message, 'success');
        loadData();
      } else {
        Swal.fire('เกิดข้อผิดพลาด', res.message, 'error');
      }
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
